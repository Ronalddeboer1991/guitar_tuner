<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e130e">
<title>Guitar Tuner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
/* VOICE: a quiet, precise stage tool. IDEA: a guitar headstock under a meter.
   PICTURE: big needle gauge, six tuning pegs below. COLOUR: rosewood ground,
   spruce ink, green only when in tune. TYPE: system sans. LAYOUT: one column, thumb-reach. */
:root{--bg:#1e130e;--panel:#2b1c15;--ink:#f3e3c7;--dim:#a88e72;--line:#4a3427;--ok:#5ee08a;--warn:#ffb347}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden;user-select:none}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:44px}
select{padding:0 12px;flex:1;max-width:260px}
.ref{display:flex;align-items:center;gap:4px}
.ref button{width:44px}
.ref span{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 16px;gap:8px}
.gauge{width:min(100%,460px)}
.gauge svg{width:100%;height:auto;display:block}
#needle{transform-origin:200px 210px;transition:none}
.readout{text-align:center;margin-top:10px}
#note{font-size:clamp(84px,26vw,128px);font-weight:700;line-height:1;letter-spacing:-2px}
#note sub{font-size:.3em;font-weight:500;color:var(--dim);letter-spacing:0;vertical-align:baseline}
#cents{font-size:28px;font-variant-numeric:tabular-nums;font-weight:600;height:36px}
#hz{color:var(--dim);font-variant-numeric:tabular-nums;font-size:15px;height:22px}
#hint{font-size:17px;height:26px;color:var(--dim)}
body.intune #note,body.intune #cents,body.intune #hint{color:var(--ok)}
body.intune .zone{fill:var(--ok);opacity:.35}
body.idle #note,body.idle #cents{opacity:.25}
.pegs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:16px;width:min(100%,520px);margin:0 auto}
.peg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;padding:6px 0;font-size:22px;font-weight:700;position:relative}
.peg small{font-size:11px;font-weight:500;color:var(--dim)}
.peg.active{border-color:var(--ink)}
.peg.locked{background:var(--ink);color:var(--bg)}
.peg.locked small{color:var(--bg)}
.peg.done::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mode{text-align:center;color:var(--dim);font-size:13px;padding-bottom:12px;min-height:30px}
#start{position:fixed;inset:0;background:rgba(20,12,8,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;z-index:5}
#start.show{display:flex}
#start button{padding:0 28px;min-height:56px;font-size:18px;background:var(--ink);color:var(--bg);border:0}
#start p{color:var(--dim);max-width:320px;margin:0}
@media (max-height:600px){#note{font-size:72px}.peg{min-height:52px}}
</style>
</head>
<body class="idle">
<header>
  <select id="tuning" aria-label="Tuning"></select>
  <div class="ref" aria-label="Reference pitch">
    <button id="refDown" aria-label="Lower A4">−</button>
    <span id="refVal">A 440</span>
    <button id="refUp" aria-label="Raise A4">+</button>
  </div>
</header>
<main>
  <div class="gauge">
    <svg viewBox="0 0 400 230" aria-hidden="true">
      <path class="zone" d="" id="zone" fill="#f3e3c7" opacity=".08"/>
      <g id="ticks" stroke="#a88e72" stroke-linecap="round"></g>
      <g id="labels" fill="#a88e72" font-size="13" text-anchor="middle" font-family="system-ui,sans-serif"></g>
      <g id="needle"><line x1="200" y1="210" x2="200" y2="42" stroke="#f3e3c7" stroke-width="4" stroke-linecap="round"/></g>
      <circle cx="200" cy="210" r="10" fill="#f3e3c7"/>
    </svg>
  </div>
  <div class="readout">
    <div id="note">–</div>
    <div id="cents"></div>
    <div id="hz"></div>
  </div>
  <div id="hint">Play a string</div>
</main>
<div class="pegs" id="pegs"></div>
<div class="mode" id="mode">Auto: detects the string you play · tap a string to lock it</div>
<div id="start"><h2 style="margin:0">Guitar Tuner</h2><p id="startMsg">Needs the microphone to hear your guitar.</p><button id="startBtn">Start tuning</button></div>
<script src="pitch.js"></script>
<script>
{
const NAMES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
// Tunings as MIDI notes, low string (6) to high string (1).
const TUNINGS=[
  ["Standard",[40,45,50,55,59,64]],
  ["Drop D",[38,45,50,55,59,64]],
  ["Half step down",[39,44,49,54,58,63]],
  ["Full step down",[38,43,48,53,57,62]],
  ["DADGAD",[38,45,50,55,57,62]],
  ["Open G",[38,43,50,55,59,62]],
  ["Open D",[38,45,50,54,57,62]],
  ["Open E",[40,47,52,56,59,64]],
  ["Drop C",[36,43,48,53,57,62]]
];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let a4=store.get("a4",440), tIdx=store.get("tuning",0), locked=-1, current=-1;
if(!TUNINGS[tIdx]) tIdx=0;
const $=id=>document.getElementById(id);
const midiHz=m=>a4*Math.pow(2,(m-69)/12);
const nm=m=>NAMES[m%12];

// Gauge: -50..+50 cents across -60..+60 degrees.
const CX=200,CY=210,R=168,ANG=60;
const pol=(c,r)=>{const a=(c/50*ANG-90)*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)]};
{
  let t="",l="";
  for(let c=-50;c<=50;c+=5){
    const big=c%25===0,[x1,y1]=pol(c,R),[x2,y2]=pol(c,R-(big?22:c%10===0?14:9));
    t+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${c===0?4:big?3:2}"/>`;
    if(big){const [lx,ly]=pol(c,R+16);l+=`<text x="${lx}" y="${ly+4}">${c>0?"+":""}${c}</text>`}
  }
  $("ticks").innerHTML=t;$("labels").innerHTML=l;
  const [ax,ay]=pol(-3,R+4),[bx,by]=pol(3,R+4),[cx2,cy2]=pol(3,R-30),[dx,dy]=pol(-3,R-30);
  $("zone").setAttribute("d",`M${ax} ${ay} A${R+4} ${R+4} 0 0 1 ${bx} ${by} L${cx2} ${cy2} A${R-30} ${R-30} 0 0 0 ${dx} ${dy}Z`);
}

$("tuning").innerHTML=TUNINGS.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join("");
$("tuning").value=tIdx;
const done=new Set();
function renderPegs(){
  const notes=TUNINGS[tIdx][1];
  $("pegs").innerHTML=notes.map((m,i)=>`<button class="peg${i===locked?" locked":""}${i===current?" active":""}${done.has(i)?" done":""}" data-i="${i}" aria-label="String ${6-i} ${nm(m)}">${nm(m)}<small>${6-i}</small></button>`).join("");
  $("mode").textContent=locked<0?"Auto: detects the string you play · tap a string to lock it":`Locked to string ${6-locked} (${nm(notes[locked])}) · tap again for auto`;
}
$("pegs").addEventListener("click",e=>{const b=e.target.closest(".peg");if(!b)return;const i=+b.dataset.i;locked=locked===i?-1:i;renderPegs()});
$("tuning").addEventListener("change",e=>{tIdx=+e.target.value;store.set("tuning",tIdx);locked=-1;done.clear();renderPegs()});
function setRef(v){a4=Math.max(415,Math.min(466,v));store.set("a4",a4);$("refVal").textContent="A "+a4}
$("refDown").onclick=()=>setRef(a4-1);$("refUp").onclick=()=>setRef(a4+1);
setRef(a4);renderPegs();

// Audio
let ctx,an,buf,running=false,wake=null;
async function start(fromTap){
  try{
    if(!ctx){
      const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
      ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
      const src=ctx.createMediaStreamSource(stream);
      const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=50;hp.Q.value=0.7;
      an=ctx.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=0;
      src.connect(hp);hp.connect(an);
      buf=new Float32Array(an.fftSize);
    }
    if(ctx.state!=="running") await ctx.resume();
    if(ctx.state!=="running"){ if(!fromTap) return showStart(); }
    $("start").classList.remove("show");
    if(!running){running=true;requestAnimationFrame(loop)}
    keepAwake();
  }catch(err){
    showStart(err&&err.name==="NotAllowedError"?"Microphone access was blocked. Allow it in your browser's site settings, then tap Start.":"Couldn't open the microphone. Tap to try again.");
  }
}
function showStart(msg){if(msg)$("startMsg").textContent=msg;$("start").classList.add("show")}
async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ctx){ctx.resume();keepAwake()}});
$("startBtn").onclick=()=>start(true);

// Detection + smoothing
let hist=[],lastHeard=0,lastRun=0,shown=0,target=0,cand=-1,candN=0,inTuneSince=0;
function loop(t){
  requestAnimationFrame(loop);
  if(t-lastRun>=40){lastRun=t;analyse(t)}
  shown+=(target-shown)*0.25;
  $("needle").setAttribute("transform",`rotate(${Math.max(-1,Math.min(1,shown/50))*ANG} 200 210)`);
}
function analyse(t){
  an.getFloatTimeDomainData(buf);
  const r=detectPitch(buf,ctx.sampleRate,60,1100,0.9);
  if(!r||r.rms<0.004||r.clarity<0.85){
    if(t-lastHeard>600){hist=[];document.body.classList.add("idle");document.body.classList.remove("intune");$("hint").textContent="Play a string";target=0;$("hz").textContent="";$("cents").textContent=""}
    return;
  }
  // Drop outliers vs. recent readings (pluck transients, octave slips).
  if(hist.length&&Math.abs(1200*Math.log2(r.freq/median(hist)))>40) hist=[];
  hist.push(r.freq);if(hist.length>7)hist.shift();
  lastHeard=t;
  const f=median(hist);
  const notes=TUNINGS[tIdx][1];
  let s=locked;
  if(s<0){
    let best=1e9,bi=0;
    notes.forEach((m,i)=>{const d=Math.abs(1200*Math.log2(f/midiHz(m)));if(d<best){best=d;bi=i}});
    if(bi!==current){if(cand===bi)candN++;else{cand=bi;candN=1}if(candN<3&&current>=0)bi=current}
    s=bi;
  }
  if(s!==current){current=s;renderPegs()}
  const m=notes[s],c=1200*Math.log2(f/midiHz(m));
  target=c;
  const ok=Math.abs(c)<2;
  document.body.classList.remove("idle");
  document.body.classList.toggle("intune",ok);
  $("note").innerHTML=`${nm(m)}<sub>${Math.floor(m/12)-1}</sub>`;
  $("cents").textContent=(c>=0?"+":"−")+Math.abs(c).toFixed(1)+" ¢";
  $("hz").textContent=f.toFixed(2)+" Hz → "+midiHz(m).toFixed(2)+" Hz";
  $("hint").textContent=ok?"In tune":c<0?(c<-50?"Much too low — tighten ↑":"Tighten ↑"):(c>50?"Much too high — loosen ↓":"Loosen ↓");
  if(ok){if(!inTuneSince)inTuneSince=t;if(t-inTuneSince>500&&!done.has(s)){done.add(s);renderPegs()}}else inTuneSince=0;
}
function median(a){const b=[...a].sort((x,y)=>x-y),n=b.length;return n%2?b[n>>1]:(b[n/2-1]+b[n/2])/2}

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
start(false);
}
</script>
</body>
</html>
